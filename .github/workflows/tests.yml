name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Prepare benchmark results directory
        run: |
          mkdir -p benchmarks/results
          mkdir -p benchmarks/scalability/results
          mkdir -p benchmarks/accuracy/results
          mkdir -p benchmarks/plots

      - name: Download MovieLens 100K
        run: |
          mkdir -p data/movielens
          curl -L -o /tmp/ml-100k.zip https://files.grouplens.org/datasets/movielens/ml-100k.zip
          unzip -q /tmp/ml-100k.zip -d data/movielens

      - name: Generate scalability benchmark results
        env:
          PYTHONPATH: .:src
        run: |
          python benchmarks/scalability/scalability_experiment.py

      - name: Generate scalability report
        env:
          PYTHONPATH: .:src
        run: |
          python benchmarks/scalability/scaling_report.py

      - name: Run tests
        env:
          PYTHONPATH: .:src
        run: |
          pytest -q
